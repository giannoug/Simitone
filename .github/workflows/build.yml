name: Build Simitone

on:
  push:
    branches: [feat/everyday-gameplay]
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: false
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
      build_windows:
        description: 'Build Windows'
        type: boolean
        default: true
      build_linux:
        description: 'Build Linux'
        type: boolean
        default: true
      build_macos:
        description: 'Build macOS'
        type: boolean
        default: true

jobs:
  build-windows:
    if: ${{ github.event_name == 'push' || inputs.build_windows }}
    runs-on: windows-latest
    name: Build Windows

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Build Windows
      shell: pwsh
      run: |
        dotnet build Client/Simitone/Simitone.Windows/Simitone.Windows.csproj -c ${{ inputs.configuration || 'Release' }} -m:1 2>&1 | Tee-Object windows-build.log
        if ($LASTEXITCODE -ne 0) { throw 'Windows build failed.' }

    - name: Check persistence and UI command guards
      shell: pwsh
      run: |
        dotnet run --project Tests/Simitone.Checks/Simitone.Checks.csproj -c ${{ inputs.configuration || 'Release' }} -p:BuildInParallel=false 2>&1 | Tee-Object windows-checks.log
        if ($LASTEXITCODE -ne 0) { throw 'Production checks failed.' }

    - name: Check package and save-copy helpers
      shell: pwsh
      run: |
        ./Tests/Check-WindowsPackage.ps1
        ./Tests/Test-SaveCopy.ps1

    - name: Package Windows x64
      shell: pwsh
      run: |
        ./scripts/Package-Windows.ps1 -OutputDirectory '${{ runner.temp }}/simitone-package' -Configuration '${{ inputs.configuration || 'Release' }}' 2>&1 | Tee-Object windows-package.log

    - name: Upload Windows test package
      uses: actions/upload-artifact@v4
      with:
        name: Simitone-Windows-x64-${{ github.sha }}
        path: |
          ${{ runner.temp }}/simitone-package/*.zip
          ${{ runner.temp }}/simitone-package/*.sha256
        retention-days: 14
        if-no-files-found: error

    - name: Upload validation logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Windows-logs-${{ github.sha }}
        path: windows-*.log
        retention-days: 14
        if-no-files-found: warn

  build-linux:
    if: ${{ inputs.build_linux }}
    runs-on: ubuntu-latest
    name: Build Linux

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsdl2-2.0-0 libopenal1 libgtk-3-0 libgtk-3-dev libglib2.0-0 libcairo2 libpango-1.0-0 libgdk-pixbuf2.0-0 libatk1.0-0

    - name: Restore dependencies
      run: dotnet restore Client/Simitone/Simitone.Desktop/Simitone.Desktop.csproj

    - name: Build Linux
      run: dotnet build Client/Simitone/Simitone.Desktop/Simitone.Desktop.csproj -c ${{ inputs.configuration || 'Release' }} --no-restore

    - name: Upload Linux artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Simitone-Linux-x64-${{ inputs.configuration || 'Release' }}
        path: Client/Simitone/Simitone.Desktop/bin/${{ inputs.configuration || 'Release' }}/net9.0/
        if-no-files-found: error

    - name: Publish Linux (self-contained)
      run: |
        dotnet publish Client/Simitone/Simitone.Desktop/Simitone.Desktop.csproj \
          -c ${{ inputs.configuration || 'Release' }} \
          -r linux-x64 \
          --self-contained true \
          -o publish/linux-x64 \
          /p:TreatWarningsAsErrors=false \
          /p:WarningsAsErrors=""


    - name: Upload Self-Contained Linux artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Simitone-SelfContained-Linux-x64-${{ inputs.configuration || 'Release' }}
        path: publish/linux-x64/
        if-no-files-found: error

  build-macos:
    if: ${{ inputs.build_macos }}
    runs-on: macos-latest
    name: Build macOS

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Install dependencies
      run: |
        brew install sdl2

    - name: Restore dependencies
      run: dotnet restore Client/Simitone/Simitone.Desktop/Simitone.Desktop.csproj -r osx-x64 /p:TreatWarningsAsErrors=false /p:WarningsAsErrors="" /p:NoWarn=NU1605

    - name: Build macOS
      run: dotnet build Client/Simitone/Simitone.Desktop/Simitone.Desktop.csproj -c ${{ inputs.configuration || 'Release' }} -r osx-x64 --no-restore /p:TreatWarningsAsErrors=false /p:WarningsAsErrors="" /p:NoWarn=NU1605

    - name: Upload macOS artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Simitone-macOS-x64-${{ inputs.configuration || 'Release' }}
        path: Client/Simitone/Simitone.Desktop/bin/${{ inputs.configuration || 'Release' }}/net9.0/
        if-no-files-found: error

    - name: Publish macOS Intel (self-contained)
      run: |
        dotnet publish Client/Simitone/Simitone.Desktop/Simitone.Desktop.csproj \
          -c ${{ inputs.configuration || 'Release' }} \
          -r osx-x64 \
          --self-contained true \
          -o publish/osx-x64 \
          /p:TreatWarningsAsErrors=false \
          /p:WarningsAsErrors=""

    - name: Publish macOS ARM (self-contained)
      run: |
        dotnet publish Client/Simitone/Simitone.Desktop/Simitone.Desktop.csproj \
          -c ${{ inputs.configuration || 'Release' }} \
          -r osx-arm64 \
          --self-contained true \
          -o publish/osx-arm64 \
          /p:TreatWarningsAsErrors=false \
          /p:WarningsAsErrors=""

    - name: Upload Self-Contained macOS Intel artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Simitone-SelfContained-macOS-x64-${{ inputs.configuration || 'Release' }}
        path: publish/osx-x64/
        if-no-files-found: error

    - name: Upload Self-Contained macOS ARM artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Simitone-SelfContained-macOS-arm64-${{ inputs.configuration || 'Release' }}
        path: publish/osx-arm64/
        if-no-files-found: error

